# XcodeGen spec for the iOS shell. Generate with:  xcodegen generate  (in this dir)
# The Rust core is linked as a static library built by ../build-app.sh.
name: MdrApp
options:
  bundleIdPrefix: net.oxge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  MdrApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleName: mdr
        CFBundleDisplayName: mdr
        CFBundleIdentifier: net.oxge.mdr
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # --- "Acrobat-style" document handling for .md ---
        LSSupportsOpeningDocumentsInPlace: true   # edit the original file, not a copy
        UISupportsDocumentBrowser: true           # app is a document-based app (Files-like browser)
        UIFileSharingEnabled: true                # app folder visible in Files
        NSPhotoLibraryUsageDescription: Insert photos into Markdown documents.
        # Remote images: https anywhere; plain http only to local / private addresses
        # (same policy as the desktop build, enforced in the Rust core).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Show images that a document links from devices on your local network (for example a NAS).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner                  # first choice for .md in Files / share sheet
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: [text/markdown, text/x-markdown]
    entitlements:
      path: MdrApp.entitlements
      properties:
        com.apple.security.application-groups: [group.net.oxge.mdr]
    dependencies:
      - target: MdrShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.oxge.mdr
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/../mdr_core.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lmdr"]
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios/release"
        ENABLE_BITCODE: "NO"
        # The Rust core is built for arm64 only (Apple Silicon simulator / devices)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ARCHS: arm64
        SWIFT_OPTIMIZATION_LEVEL: "-O"
      configs:
        # `@testable import MdrApp` needs the app built with testability.
        Debug:
          ENABLE_TESTABILITY: "YES"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    scheme:
      testTargets:
        - MdrAppTests
      gatherCoverageData: true
  # Share Extension: "mdr" in any app's share sheet for text and files.
  # Saves into the App Group Inbox; the app imports it on next activation.
  MdrShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ../MdrShare
        excludes: ["*.entitlements"]
    entitlements:
      path: ../MdrShare/MdrShare.entitlements
      properties:
        com.apple.security.application-groups: [group.net.oxge.mdr]
    info:
      path: ../MdrShare/Info.plist
      properties:
        CFBundleName: mdr
        CFBundleDisplayName: mdr
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.oxge.mdr.share
        ARCHS: arm64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  # Contract tests over the Rust core, mirroring
  # android/app/src/androidTest/.../MdrCoreInstrumentedTest.kt case for case.
  # Hosted in MdrApp so the `mdr_*` symbols resolve out of the app binary
  # (-bundle_loader): the core is linked once, not once per target.
  #   xcodebuild -project ios/MdrApp/MdrApp.xcodeproj -scheme MdrApp \
  #     -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' test
  MdrAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../MdrAppTests
    dependencies:
      - target: MdrApp
    info:
      path: ../MdrAppTests/Info.plist
      properties:
        CFBundleName: MdrAppTests
        # The test bundle carries its own Info.plist, so it cannot read the
        # app's CFBundleShortVersionString. Mirror it here; the version test
        # compares this against what the linked Rust core reports, which is how
        # a stale libmdr.a gets caught.
        MdrHostShortVersion: "0.4.1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.oxge.mdr.tests
        # The tests call the C ABI directly, so they need the same bridging
        # header the app uses.
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/../mdr_core.h
        ARCHS: arm64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ENABLE_BITCODE: "NO"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MdrApp.app/MdrApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
