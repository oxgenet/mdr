<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- mdr (oxgenet fork) icon: a chubby, friendly "MD" on a pastel squircle. Copyright (c) 2026 oxge.net, MIT. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3EC"/>
      <stop offset="1" stop-color="#D9D4FF"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E6BFF"/>
      <stop offset="1" stop-color="#4C48D6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4C48D6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" opacity="0.95">
    <path d="M96 118l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <path d="M418 92l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
    <path d="M430 372l6 15 15 6-15 6-6 15-6-15-15-6 15-6z"/>
  </g>

  <!-- letters: thick rounded strokes, dark outline behind a bright fill -->
  <g filter="url(#soft)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- outline pass -->
    <g stroke="#2F2C5C" stroke-width="86">
      <path d="M92 356V186l60 92 60-92v170"/>
      <path d="M270 186h56c60 0 96 36 96 85s-36 85-96 85h-56z"/>
    </g>
    <!-- fill pass -->
    <g stroke="url(#ink)" stroke-width="58">
      <path d="M92 356V186l60 92 60-92v170"/>
      <path d="M270 186h56c60 0 96 36 96 85s-36 85-96 85h-56z"/>
    </g>
    <!-- highlight pass -->
    <g stroke="#FFFFFF" stroke-width="16" opacity="0.55">
      <path d="M92 350V196"/>
      <path d="M270 196v150"/>
    </g>
  </g>

  <!-- face on the D: eyes + smile + blush -->
  <g>
    <circle cx="352" cy="256" r="9" fill="#2F2C5C"/>
    <circle cx="392" cy="256" r="9" fill="#2F2C5C"/>
    <circle cx="349" cy="253" r="3" fill="#FFFFFF"/>
    <circle cx="389" cy="253" r="3" fill="#FFFFFF"/>
    <path d="M356 282q16 14 32 0" fill="none" stroke="#2F2C5C" stroke-width="7" stroke-linecap="round"/>
    <circle cx="334" cy="278" r="10" fill="#FF9BB8" opacity="0.85"/>
    <circle cx="410" cy="278" r="10" fill="#FF9BB8" opacity="0.85"/>
  </g>
</svg>
