name: Update deps & build

# Refreshes every dependency to its newest compatible version (cargo update),
# then builds the webview viewer/editor for macOS and Windows.
# Runs on push to main, weekly, and on demand. Artifacts are attached to the run;
# tag pushes (v*) additionally publish a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 1'   # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mdr
            archive: mdr-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mdr
            archive: mdr-x86_64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mdr.exe
            archive: mdr-x86_64-pc-windows-msvc.zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: mdr.exe
            archive: mdr-aarch64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Fetch latest dependency versions
        run: |
          cargo update
          cargo tree --depth 1 --target ${{ matrix.target }} > deps-${{ matrix.target }}.txt
          cat deps-${{ matrix.target }}.txt

      - name: Build release binary (webview backend)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign -s - --force target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Upload resolved dependency list
        uses: actions/upload-artifact@v4
        with:
          name: deps-${{ matrix.target }}
          path: deps-${{ matrix.target }}.txt

  # Experimental: does the webview crate stack even compile for mobile targets?
  # wry/tao support iOS and Android, but this binary is a desktop CLI (no app
  # bundle, no mobile entry point). This job is a compile probe only and is
  # allowed to fail; it does NOT produce an .ipa or .apk.
  mobile-check:
    name: Compile check ${{ matrix.target }} (experimental)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-ios
          - os: ubuntu-latest
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk

      - name: Fetch latest dependency versions
        run: cargo update

      - name: cargo check (iOS)
        if: matrix.target == 'aarch64-apple-ios'
        run: cargo check --target ${{ matrix.target }} --no-default-features --features webview-backend

      - name: cargo check (Android)
        if: matrix.target == 'aarch64-linux-android'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a check --no-default-features --features webview-backend

  # Launch the real Windows binary on a GUI runner, open each sample document,
  # and capture the screen. Screenshots are uploaded as an artifact so the
  # rendering (CJK fonts/glyphs, Mermaid, images) can be checked without a
  # Windows machine at hand.
  windows-screenshots:
    name: Windows rendering check (screenshots)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows x64 binary
        uses: actions/download-artifact@v4
        with:
          name: mdr-x86_64-pc-windows-msvc.zip
          path: dist

      - name: Unpack
        shell: pwsh
        run: Expand-Archive -Path dist/mdr-x86_64-pc-windows-msvc.zip -DestinationPath dist/bin -Force

      - name: Run samples and capture screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $exe = (Resolve-Path dist/bin/mdr.exe).Path
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen: $($bounds.Width)x$($bounds.Height)" | Tee-Object -FilePath shots/info.txt
          Get-ChildItem tests/samples/lang/*.md | ForEach-Object {
            $md = $_.FullName
            $name = $_.BaseName
            $p = Start-Process -FilePath $exe -ArgumentList @('-v', "`"$md`"") -WorkingDirectory $_.DirectoryName -PassThru -RedirectStandardError "shots/$name.log"
            Start-Sleep -Seconds 12
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("shots/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            "captured $name (pid $($p.Id), exited=$($p.HasExited))" | Tee-Object -FilePath shots/info.txt -Append
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
          Get-Content shots/*.log | Select-String "lang=" | Tee-Object -FilePath shots/info.txt -Append

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: shots/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mdr-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
