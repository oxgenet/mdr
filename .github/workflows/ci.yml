name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libgl1-mesa-dev

      - name: Build (all features)
        run: cargo build --release

      - name: Build (egui only)
        run: cargo build --release --no-default-features --features egui-backend

      - name: Build (webview only)
        run: cargo build --release --no-default-features --features webview-backend

      - name: Build (tui only)
        run: cargo build --release --no-default-features --features tui-backend

      # The About dialog's attribution list is generated; fail here rather than
      # shipping a stale one.
      - name: Check generated licence list is current
        if: runner.os == 'Linux'
        run: python scripts/gen-licenses.py --check

      - name: Run clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Run tests
        run: cargo test

      # The feature set the iOS and Android shells link (rendering core + C ABI,
      # no desktop backend). Running it on every OS also exercises the path
      # handling in the FFI base_dir tests against Windows separators.
      - name: "Run tests (mobile core: svg + FFI only)"
        run: cargo test --lib --no-default-features --features svg

  android:
    name: Android shell
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: android-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Builds libmdr.so for both ABIs into app/src/main/jniLibs, then the
      # Gradle build with -PskipRustBuild just packages what is already there.
      - name: Build the Rust core for Android
        run: |
          cd android
          ./gradlew :app:buildRustCore --no-daemon

      - name: Assemble and run JVM unit tests
        run: |
          cd android
          ./gradlew :app:assembleDebug :app:testDebugUnitTest -PskipRustBuild --no-daemon

      # Compiling androidTest catches API misuse without paying for an
      # emulator; the emulator job below actually runs them.
      - name: Compile instrumented tests
        run: |
          cd android
          ./gradlew :app:assembleDebugAndroidTest -PskipRustBuild --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mdr-android-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk

  android-instrumented:
    name: Android instrumented tests (emulator)
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # MdrCoreInstrumentedTest asserts the same contract as src/ffi.rs, but
      # through JNI on a real Android runtime.
      #
      # -PrustAbis=x86_64 matters: only that Rust target is installed above, so
      # the default two-ABI build would fail before the emulator was even used.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -PrustAbis=x86_64 --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-report
          path: android/app/build/reports/androidTests/

  macos-app:
    name: Mdr.app bundle
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install librsvg
        run: brew install librsvg

      # Host arch only: this job guards macos/build-app.sh against bit rot,
      # the release workflow does the universal build.
      - name: Build Mdr.app
        run: ./macos/build-app.sh

      - name: Verify the bundle
        run: |
          ./target/macos/Mdr.app/Contents/MacOS/mdr --version
          codesign --verify --verbose=2 ./target/macos/Mdr.app
          plutil -lint ./target/macos/Mdr.app/Contents/Info.plist
          test -f ./target/macos/Mdr.app/Contents/Resources/Mdr.icns

      # Behaviour, not just shape. The AppleScript half is skipped: reading
      # another app's windows goes through System Events, which needs
      # Accessibility permission that a runner cannot grant. What is left still
      # exercises the shipped binary, including --install-cli's refusal to
      # clobber a real one. Run it locally without the flag for the rest.
      - name: Test the bundle's behaviour
        run: MDR_SKIP_APPLESCRIPT=1 ./macos/test-app.sh

  ios:
    name: iOS shell tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ios-cargo-

      - name: Install xcodegen
        run: brew install xcodegen

      # Builds the staticlib, generates the Xcode project, boots a simulator,
      # seeds the fixture and runs both suites: MdrAppTests (the Rust core
      # across the C ABI, mirroring the Android instrumented tests) and
      # MdrUITests (the app driven through its UI).
      - name: Build and test the iOS shell
        run: MDR_EXPECT_LANG=ja ./ios/build-app.sh tests/samples/lang/ja.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            target/ios-app/TestResults.xcresult
            target/ios-app/test.log
            target/ios-app/screenshot.png
