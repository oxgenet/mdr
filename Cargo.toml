[package]
name = "mdr"
version = "0.4.0"
edition = "2021"
description = "Markdown viewer/editor with Mermaid and CJK-aware rendering (oxgenet fork of Clever Cloud's mdr)"
license = "MIT"
repository = "https://github.com/oxgenet/mdr"
homepage = "https://github.com/oxgenet/mdr"
readme = "README.md"
# Original work: Clever Cloud <opensource@clever-cloud.com> (https://github.com/CleverCloud/mdr)
authors = ["oxge.net <tkykszk@gmail.com>", "Clever Cloud <opensource@clever-cloud.com>"]
# This fork is not published to crates.io; the `mdr` crate there is upstream's.
publish = false
categories = ["command-line-utilities", "text-processing"]
keywords = ["markdown", "viewer", "mermaid", "tui", "webview"]

[features]
# This fork ships the webview viewer/editor by default. Add egui/tui explicitly:
#   cargo build --features egui-backend,tui-backend
default = ["webview-backend"]
egui-backend = [
  "dep:eframe",
  "dep:egui_commonmark",
  "dep:resvg",
  "dep:usvg",
  "dep:tiny-skia",
  "dep:fontdb",
]
webview-backend = [
  "dep:wry",
  "dep:tao",
  "dep:muda",
  "dep:resvg",
  "dep:usvg",
  "dep:tiny-skia",
]
tui-backend = [
  "dep:ratatui",
  "dep:crossterm",
  "dep:ratatui-image",
  "dep:ureq",
  "dep:resvg",
  "dep:usvg",
  "dep:tiny-skia",
  "image/jpeg",
  "image/gif",
  "image/webp",
]

[dependencies]
# Core
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.52", default-features = false, features = ["syntect"] }
notify = "8"
notify-debouncer-mini = "0.7"
mermaid-rs-renderer = { version = "0.2", default-features = false }
regex = "1"
serde_json = "1"
base64 = "0.22"
kdl = "6"

# egui backend
eframe = { version = "0.34", features = ["persistence"], optional = true }
egui_commonmark = { version = "0.23", features = [
  "better_syntax_highlighting",
  "load-images",
  "svg",
  "embedded_image",
], optional = true }
resvg = { version = "0.47", optional = true }
usvg = { version = "0.47", optional = true }
tiny-skia = { version = "0.12", optional = true }
fontdb = { version = "0.23", optional = true }

# webview backend
wry = { version = "0.55", optional = true }
tao = { version = "0.35", optional = true }
muda = { version = "0.19", optional = true }

# tui backend
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
ratatui-image = { version = "11.0", default-features = false, features = [
  "image-defaults",
  "crossterm",
], optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.deb]
name = "mdr"
maintainer = "oxge.net <tkykszk@gmail.com>"
copyright = "2026 Clever Cloud <opensource@clever-cloud.com>, 2026 oxge.net"
license-file = ["packaging/debian/copyright", "0"]
section = "text"
assets = [
  ["target/release/mdr", "/usr/bin/mdr", "755"],
  ["NOTICE.md", "/usr/share/doc/mdr/NOTICE.md", "644"],
  ["README.md", "/usr/share/doc/mdr/README.md", "644"],
]
extended-description = """\
Markdown viewer and editor with Mermaid diagrams, live reload, and CJK-aware
rendering (Japanese, Simplified/Traditional Chinese, Korean).
.
This is the oxgenet fork of mdr by Clever Cloud (https://github.com/CleverCloud/mdr),
not affiliated with Clever Cloud. See /usr/share/doc/mdr/NOTICE.md."""

[package.metadata.generate-rpm]
license = "MIT"
vendor = "oxge.net <tkykszk@gmail.com>"
url = "https://github.com/oxgenet/mdr"
assets = [
  { source = "target/release/mdr", dest = "/usr/bin/mdr", mode = "0755" },
  { source = "LICENSE", dest = "/usr/share/licenses/mdr/LICENSE", mode = "0644", doc = true },
  { source = "NOTICE.md", dest = "/usr/share/doc/mdr/NOTICE.md", mode = "0644", doc = true },
]
