# XcodeGen spec for the iOS shell. Generate with:  xcodegen generate  (in this dir)
# The Rust core is linked as a static library built by ../build-app.sh.
name: MdrApp
options:
  bundleIdPrefix: net.oxge
  # Scheme file references are written relative to this. The default "../../"
  # would resolve Mdr.storekit to the repo root; it sits next to the project.
  schemePathPrefix: "../"
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Simulator builds and the test suites run unsigned; device builds must
    # sign normally. Scoping this to the simulator SDK is what lets automatic
    # signing pick Apple Development for a device build and Apple Distribution
    # for a Release archive. It used to be an unconditional "NO" plus an empty
    # CODE_SIGN_IDENTITY, which is why ios/build-device.sh had to force
    # CODE_SIGN_IDENTITY=Apple Development back on — the wrong identity for an
    # App Store archive, and the reason that override existed at all.
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
    CODE_SIGN_STYLE: Automatic
    # Overridden per archive by ios/build-device.sh.
    DEVELOPMENT_TEAM: ""
    # The TestFlight build number. App Store Connect rejects a build number it
    # has already seen, so a second upload of "1" fails. Both the app and the
    # Share Extension read CFBundleVersion from this one setting, which is what
    # keeps them in lockstep — a mismatch is itself a rejection. ios/build-device.sh
    # overrides it per archive (commit count, or MDR_BUILD_NUMBER).
    CURRENT_PROJECT_VERSION: "1"
targets:
  MdrApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources
      # Bundled so SKTestSession can load it by name from the test run, and so
      # the scheme can point at it for manual runs in the simulator.
      - path: Mdr.storekit
    info:
      path: Info.plist
      properties:
        CFBundleName: mdr
        CFBundleDisplayName: mdr
        CFBundleIdentifier: net.oxge.mdr
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Without this, every upload sits in "Missing Compliance" until someone
        # answers the export question by hand in App Store Connect. mdr does no
        # encryption of its own; it only ever speaks HTTPS, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: en
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # An iPad build (TARGETED_DEVICE_FAMILY 1,2) that does not require full
        # screen has to support all four, or the archive warns and App Store
        # Connect can reject it. Upside-down was the missing one.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # --- "Acrobat-style" document handling for .md ---
        LSSupportsOpeningDocumentsInPlace: true   # edit the original file, not a copy
        UISupportsDocumentBrowser: true           # app is a document-based app (Files-like browser)
        UIFileSharingEnabled: true                # app folder visible in Files
        NSPhotoLibraryUsageDescription: Insert photos into Markdown documents.
        # Remote images: https anywhere; plain http only to local / private addresses
        # (same policy as the desktop build, enforced in the Rust core).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Show images that a document links from devices on your local network (for example a NAS).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner                  # first choice for .md in Files / share sheet
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: [text/markdown, text/x-markdown]
    entitlements:
      path: MdrApp.entitlements
      properties:
        com.apple.security.application-groups: [group.net.oxge.mdr]
    dependencies:
      - target: MdrShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.oxge.mdr
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/../mdr_core.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The staticlib is named by full path, not found via -lmdr on a search
        # path. Cargo's crate-type list gained `cdylib` for Android's
        # System.loadLibrary, so `cargo build` now drops libmdr.dylib next to
        # libmdr.a for *every* target, iOS included — and ld prefers a .dylib
        # over a .a of the same name. The app was therefore linking
        # /Users/<you>/mdr/target/.../libmdr.dylib by absolute path: fine in the
        # simulator, which shares the Mac's filesystem, and a launch crash on any
        # real device. Naming the archive leaves nothing to choose between.
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release/libmdr.a"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios/release/libmdr.a"
        ENABLE_BITCODE: "NO"
        # The Rust core is built for arm64 only (Apple Silicon simulator / devices)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ARCHS: arm64
        SWIFT_OPTIMIZATION_LEVEL: "-O"
      configs:
        # `@testable import MdrApp` needs the app built with testability.
        Debug:
          ENABLE_TESTABILITY: "YES"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    scheme:
      # The test plan is what carries the StoreKit configuration into the
      # *test* action; XcodeGen's `storeKitConfiguration` only reaches the run
      # action, which is why the two are set separately.
      testPlans:
        - path: MdrApp.xctestplan
          defaultPlan: true
      gatherCoverageData: true
      storeKitConfiguration: Mdr.storekit
      # Local StoreKit testing: the tip jar can be exercised in the simulator,
      # and in the test run, without anything existing in App Store Connect.
      # The tests drive SKTestSession directly, which does not depend on this;
      # this is what makes a manual Run show the three tiers too.
  # Share Extension: "mdr" in any app's share sheet for text and files.
  # Saves into the App Group Inbox; the app imports it on next activation.
  MdrShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ../MdrShare
        excludes: ["*.entitlements"]
    entitlements:
      path: ../MdrShare/MdrShare.entitlements
      properties:
        com.apple.security.application-groups: [group.net.oxge.mdr]
    info:
      path: ../MdrShare/Info.plist
      properties:
        CFBundleName: mdr
        CFBundleDisplayName: mdr
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.oxge.mdr.share
        ARCHS: arm64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  # Contract tests over the Rust core, mirroring
  # android/app/src/androidTest/.../MdrCoreInstrumentedTest.kt case for case.
  # Hosted in MdrApp so the `mdr_*` symbols resolve out of the app binary
  # (-bundle_loader): the core is linked once, not once per target.
  #   xcodebuild -project ios/MdrApp/MdrApp.xcodeproj -scheme MdrApp \
  #     -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' test
  MdrAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../MdrAppTests
      # SKTestSession(configurationFileNamed:) looks in the bundle of the code
      # that calls it, which is the test bundle — not the app's. The app target
      # gets its own copy so a manual Run shows the tiers too.
      - path: Mdr.storekit
    dependencies:
      - target: MdrApp
      # SKTestSession lives in StoreKitTest, not StoreKit. It serves
      # Mdr.storekit locally, which is how the purchase path is covered
      # without anything existing in App Store Connect.
      - sdk: StoreKitTest.framework
    info:
      path: ../MdrAppTests/Info.plist
      properties:
        CFBundleName: MdrAppTests
        # The test bundle carries its own Info.plist, so it cannot read the
        # app's CFBundleShortVersionString. Mirror it here; the version test
        # compares this against what the linked Rust core reports, which is how
        # a stale libmdr.a gets caught.
        MdrHostShortVersion: "0.4.1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.oxge.mdr.tests
        # The tests call the C ABI directly, so they need the same bridging
        # header the app uses.
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/../mdr_core.h
        ARCHS: arm64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ENABLE_BITCODE: "NO"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MdrApp.app/MdrApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # End-to-end tests through the real UI, driven by `xcodebuild test`. These
  # replace the NSLog greps ios/build-app.sh used to do; see that script.
  MdrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../MdrUITests
    dependencies:
      - target: MdrApp
    info:
      path: ../MdrUITests/Info.plist
      properties:
        CFBundleName: MdrUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.oxge.mdr.uitests
        TEST_TARGET_NAME: MdrApp
        ARCHS: arm64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
