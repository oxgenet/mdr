name: Release

on:
  push:
    tags:
      - 'v*'
      # Pre-release tags belong to the staging channel (release-stg.yml). A
      # staging tag like v1.2.3-stg.4 matches 'v*' too, so exclude it here or
      # both workflows would fire on one tag and fight over the release.
      - '!v*-stg*'
      - '!v*-rc*'
      - '!v*-beta*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mdr
            archive: mdr-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mdr
            archive: mdr-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mdr
            archive: mdr-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mdr.exe
            archive: mdr-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libgl1-mesa-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp LICENSE NOTICE.md target/${{ matrix.target }}/release/
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }} LICENSE NOTICE.md

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}", "LICENSE", "NOTICE.md" -DestinationPath "${{ matrix.archive }}"

      # Current GitHub windows images no longer ship the WiX 3 toolset. Fetch
      # the standalone binaries (no installer) and call candle/light by full
      # path via $WIX_BIN. This exact zip and wxs were validated to produce a
      # valid MSI; choco's package version and PATH propagation were not
      # reliable and were the cause of the first failed run.
      - name: Install WiX 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $dir = "$env:RUNNER_TEMP\wix"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$dir\wix.zip"
          Expand-Archive -LiteralPath "$dir\wix.zip" -DestinationPath "$dir\bin" -Force
          "WIX_BIN=$dir\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      # MSI for the production channel, from the shared wix/main.wxs. Installs
      # as mdr.exe with its own UpgradeCode, so it upgrades earlier mdr MSIs and
      # coexists with the staging installer (which carries a different one).
      - name: Package MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $full = "$env:GITHUB_REF_NAME" -replace '^v',''
          $msiver = $full -replace '-.*',''
          & "$env:WIX_BIN\candle.exe" wix/main.wxs `
            -dBinName="mdr" `
            -dProductName="mdr" `
            -dVersion="$msiver" `
            -dSourceExe="target/${{ matrix.target }}/release/mdr.exe" `
            -dUpgradeCode="BA86150A-CC18-40AF-861C-0B99F7134E7D" `
            -dPathGuid="C1393698-3CA3-4C27-9C38-C99BD5E480D4" `
            -o main.wixobj
          & "$env:WIX_BIN\light.exe" -ext WixUIExtension -cultures:en-us `
            main.wixobj -o "mdr-$full-x86_64.msi"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Upload MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mdr-msi
          path: '*.msi'

  build-macos-app:
    name: Build Mdr.app (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Sharp .icns from the SVG; the script falls back to sips without it.
      - name: Install librsvg
        run: brew install librsvg

      # Developer ID signing + notarization when the secrets are configured;
      # otherwise the bundle stays ad-hoc signed and users run `xattr -dr`.
      # Homebrew Cask requires the notarized path: casks that fail Gatekeeper
      # are no longer supported, and --no-quarantine was removed in brew 4.7.
      # The `secrets` context is not available in a step `if:`, so gate on an
      # env var derived from it instead.
      - name: Check for signing secrets
        id: signing
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
          HAS_NOTARY: ${{ secrets.MACOS_NOTARY_APP_PASSWORD != '' }}
        run: |
          echo "cert=$HAS_CERT" >> "$GITHUB_OUTPUT"
          echo "notary=$HAS_NOTARY" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: steps.signing.outputs.cert == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import cert.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" build.keychain
          rm -f cert.p12

      - name: Store notarization credentials
        if: steps.signing.outputs.notary == 'true'
        run: |
          xcrun notarytool store-credentials mdr-notary \
            --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.MACOS_TEAM_ID }}" \
            --password "${{ secrets.MACOS_NOTARY_APP_PASSWORD }}"

      - name: Build Mdr.app + .dmg
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ steps.signing.outputs.notary == 'true' && 'mdr-notary' || '' }}
        run: ./macos/build-app.sh --universal --dmg

      - name: Zip Mdr.app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # ditto preserves the bundle's symlinks and the ad-hoc signature,
          # which `zip` does not.
          ditto -c -k --sequesterRsrc --keepParent \
            target/macos/Mdr.app "Mdr-${VERSION}-macos-universal.zip"
          mv target/macos/*.dmg .

      - name: Verify the bundle runs
        run: |
          ./target/macos/Mdr.app/Contents/MacOS/mdr --version
          lipo -info ./target/macos/Mdr.app/Contents/MacOS/mdr
          codesign --verify --verbose=2 ./target/macos/Mdr.app
          # Reports "accepted" only for a notarized build; an ad-hoc one is
          # rejected here and still ships — it is the xattr path users take.
          spctl --assess --type execute --verbose=4 ./target/macos/Mdr.app || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdr-macos-app
          path: |
            Mdr-*-macos-universal.zip
            Mdr-*.dmg

  build-deb:
    name: Build .deb package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libgl1-mesa-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb
        run: cargo deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdr-deb
          path: target/debian/*.deb

  build-rpm:
    name: Build .rpm package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libgl1-mesa-dev

      - name: Build release binary
        run: cargo build --release

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdr-rpm
          path: target/generate-rpm/*.rpm

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.HOMEBREW_TAP_ENABLED == 'true' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA256
        id: sha
        run: |
          echo "sha_aarch64=$(sha256sum artifacts/mdr-aarch64-apple-darwin.tar.gz/mdr-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "sha_x86_64=$(sha256sum artifacts/mdr-x86_64-apple-darwin.tar.gz/mdr-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "sha_linux=$(sha256sum artifacts/mdr-x86_64-unknown-linux-gnu.tar.gz/mdr-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate and push formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA_AARCH64: ${{ steps.sha.outputs.sha_aarch64 }}
          SHA_X86_64: ${{ steps.sha.outputs.sha_x86_64 }}
          SHA_LINUX: ${{ steps.sha.outputs.sha_linux }}
        run: |
          cat > mdr.rb <<EOF
          class Mdr < Formula
            desc "Markdown viewer/editor with Mermaid and CJK-aware rendering (oxgenet fork of Clever Cloud's mdr)"
            homepage "https://github.com/oxgenet/mdr"
            version "${VERSION}"
            license "MIT"
            conflicts_with "mdr", because: "both install a mdr binary; this is the oxgenet fork"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/oxgenet/mdr/releases/download/v${VERSION}/mdr-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64}"
              else
                url "https://github.com/oxgenet/mdr/releases/download/v${VERSION}/mdr-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64}"
              end
            end

            on_linux do
              url "https://github.com/oxgenet/mdr/releases/download/v${VERSION}/mdr-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "mdr"
            end

            test do
              system "#{bin}/mdr", "--version"
            end
          end
          EOF

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/oxgenet/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp mdr.rb tap/Formula/mdr.rb
          cd tap
          git config user.email "tkykszk@gmail.com"
          git config user.name "oxgenet mdr CI"
          git add Formula/mdr.rb
          git diff --cached --quiet || git commit -m "Update mdr to ${VERSION}"
          git push

  update-winget:
    name: Update WinGet
    needs: release
    runs-on: windows-latest
    if: ${{ vars.WINGET_ENABLED == 'true' }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: opusify.mdr
          installers-regex: 'windows'
          token: ${{ secrets.WINGET_TOKEN }}

  update-aur:
    name: Update AUR
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.AUR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: mdr-x86_64-unknown-linux-gnu.tar.gz
          path: artifacts

      - name: Compute SHA256
        id: sha
        run: echo "sha256=$(sha256sum artifacts/mdr-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Generate PKGBUILD
        run: |
          cat > PKGBUILD << 'PKGEOF'
          # Maintainer: Opusify IT Solutions Pvt. Ltd. <tkykszk@gmail.com>
          pkgname=mdr-ox-bin
          pkgver=${{ steps.version.outputs.version }}
          pkgrel=1
          pkgdesc="Markdown viewer/editor with Mermaid and CJK-aware rendering (oxgenet fork of Clever Cloud mdr)"
          arch=('x86_64')
          url="https://github.com/oxgenet/mdr"
          license=('MIT')
          provides=('mdr')
          conflicts=('mdr' 'mdr-bin')
          source=("https://github.com/oxgenet/mdr/releases/download/v${pkgver}/mdr-x86_64-unknown-linux-gnu.tar.gz")
          sha256sums=('${{ steps.sha.outputs.sha256 }}')

          package() {
            install -Dm755 "${srcdir}/mdr" "${pkgdir}/usr/bin/mdr"
          }
          PKGEOF

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: mdr-bin
          pkgbuild: ./PKGBUILD
          commit_username: "oxgenet mdr CI"
          commit_email: "tkykszk@gmail.com"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.version }}"

  update-chocolatey:
    name: Update Chocolatey
    needs: release
    runs-on: windows-latest
    if: ${{ vars.CHOCOLATEY_ENABLED == 'true' }}
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mdr-x86_64-pc-windows-msvc.zip
          path: artifacts

      - name: Extract version
        id: version
        shell: pwsh
        run: echo "version=$("$env:GITHUB_REF_NAME" -replace '^v','')" >> $env:GITHUB_OUTPUT

      - name: Compute SHA256
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/mdr-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash.ToLower()
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Generate nuspec and install script
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          mkdir choco-pkg/tools
          $nuspec = "<?xml version=`"1.0`" encoding=`"utf-8`"?>`n<package xmlns=`"http://schemas.microsoft.com/packaging/2010/07/nuspec.xsd`">`n  <metadata>`n    <id>mdr</id>`n    <version>$env:VERSION</version>`n    <title>mdr</title>`n    <authors>Opusify IT Solutions Pvt. Ltd.</authors>`n    <owners>oxgenet</owners>`n    <summary>A lightweight Markdown viewer with live reload</summary>`n    <description>A lightweight Markdown viewer with Mermaid diagram support, live reload, and multiple rendering backends (egui, webview, TUI).</description>`n    <projectUrl>https://github.com/oxgenet/mdr</projectUrl>`n    <tags>markdown viewer mermaid tui</tags>`n    <licenseUrl>https://github.com/oxgenet/mdr/blob/main/LICENSE</licenseUrl>`n    <requireLicenseAcceptance>false</requireLicenseAcceptance>`n  </metadata>`n</package>"
          [System.IO.File]::WriteAllText("choco-pkg/mdr.nuspec", $nuspec)
          $install = "`$ErrorActionPreference = 'Stop'`n`$url = `"https://github.com/oxgenet/mdr/releases/download/v$env:VERSION/mdr-x86_64-pc-windows-msvc.zip`"`n`$checksum = `"$env:SHA256`"`nInstall-ChocolateyZipPackage -PackageName 'mdr' -Url64bit `$url -Checksum64 `$checksum -ChecksumType64 'sha256' -UnzipLocation `"`$(Split-Path -Parent `$MyInvocation.MyCommand.Definition)`""
          [System.IO.File]::WriteAllText("choco-pkg/tools/chocolateyInstall.ps1", $install)

      - name: Pack and push
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          cd choco-pkg
          choco pack mdr.nuspec
          choco push (Get-Item *.nupkg).Name --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY

  update-scoop:
    name: Update Scoop bucket
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.SCOOP_ENABLED == 'true' }}
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mdr-x86_64-pc-windows-msvc.zip
          path: artifacts

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Compute SHA256
        id: sha
        run: echo "sha256=$(sha256sum artifacts/mdr-x86_64-pc-windows-msvc.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Generate and push manifest
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          cat > mdr.json << EOF
          {
            "version": "${VERSION}",
            "architecture": {
              "64bit": {
                "url": "https://github.com/oxgenet/mdr/releases/download/v${VERSION}/mdr-x86_64-pc-windows-msvc.zip",
                "hash": "${SHA256}"
              }
            },
            "bin": "mdr.exe",
            "checkver": {
              "github": "https://github.com/oxgenet/mdr"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/oxgenet/mdr/releases/download/v\$version/mdr-x86_64-pc-windows-msvc.zip"
                }
              }
            },
            "homepage": "https://github.com/oxgenet/mdr",
            "license": "MIT",
            "description": "Markdown viewer/editor with Mermaid and CJK-aware rendering (oxgenet fork of Clever Cloud mdr)"
          }
          EOF

          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/oxgenet/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp mdr.json bucket/bucket/mdr.json
          cd bucket
          git config user.email "tkykszk@gmail.com"
          git config user.name "oxgenet mdr CI"
          git add bucket/mdr.json
          git diff --cached --quiet || git commit -m "Update mdr to ${VERSION}"
          git push

  update-snap:
    name: Publish to Snap Store
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.SNAP_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge

  release:
    name: Create Release
    needs: [build, build-macos-app, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
